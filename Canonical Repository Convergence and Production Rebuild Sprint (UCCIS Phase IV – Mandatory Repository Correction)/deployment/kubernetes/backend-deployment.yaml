apiVersion: apps/v1
kind: Deployment

metadata:
  name: uccis-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: uccis-backend

  template:
    metadata:
      labels:
        app: uccis-backend

    spec:
      containers:
        - name: backend

          image: uccis/backend:latest

          ports:
            - containerPort: 5000
