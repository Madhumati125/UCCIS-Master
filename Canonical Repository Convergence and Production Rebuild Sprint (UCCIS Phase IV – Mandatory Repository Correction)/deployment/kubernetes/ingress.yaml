apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: uccis-ingress

spec:
  rules:
    - host: uccis.local

      http:
        paths:
          - path: /

            pathType: Prefix

            backend:
              service:
                name: uccis-frontend

                port:
                  number: 5173
