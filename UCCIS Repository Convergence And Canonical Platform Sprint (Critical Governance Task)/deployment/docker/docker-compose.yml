version: "3.9"

services:

  backend:
    build:
      context: ../../backend
      dockerfile: ../deployment/docker/Dockerfile.backend

    ports:
      - "5000:5000"

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend